<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페널티킥 · PENALTY SHOOTOUT</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blau:#004d98;--grana:#a50044;--gold:#d69e00;--ink:#ffffff}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--ink);color:#1a2235;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6;display:flex;flex-direction:column;align-items:center}

.topbar{width:100%;position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-bottom:1px solid #e2e8f0}
.topbar a{color:var(--grana);text-decoration:none;font-size:14px;font-weight:700}
.topbar a:hover{text-decoration:underline}

.wrap{width:100%;max-width:560px;padding:28px 20px 48px;text-align:center}
h1{font-size:clamp(28px,7vw,44px);font-weight:900;letter-spacing:1px;margin-bottom:6px;
  background:linear-gradient(90deg,var(--gold),var(--grana) 60%,var(--blau));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:13px;color:#64748b;letter-spacing:2px;text-transform:uppercase;margin-bottom:20px}

.scorebar{display:flex;justify-content:center;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:#f5f7fb;border:1px solid #e2e8f0;border-radius:12px;padding:10px 16px;min-width:92px;box-shadow:0 6px 18px rgba(0,30,80,0.06)}
.chip .l{font-size:11px;color:#64748b;letter-spacing:1px}
.chip .v{font-size:20px;font-weight:900;color:#0f172a}

.board-shell{display:inline-block;padding:12px;border-radius:18px;background:#0b3d16;box-shadow:0 18px 44px rgba(0,30,80,0.25);border:1px solid #0a5c22}
canvas{display:block;border-radius:10px;background:#15803d}

.msg{min-height:26px;margin-top:16px;font-size:16px;font-weight:800;color:var(--grana)}

/* 컨트롤 */
.controls{margin-top:14px;display:flex;flex-direction:column;gap:12px;align-items:center}
.aim-row{display:flex;gap:10px;justify-content:center}
.aim-btn{width:76px;height:52px;border:1px solid #e2e8f0;background:#f5f7fb;border-radius:12px;font-size:14px;font-weight:800;color:var(--blau);cursor:pointer;transition:all .15s}
.aim-btn.active{background:var(--blau);color:#fff;border-color:var(--blau)}
.aim-btn:active{transform:scale(.96)}

.power-wrap{width:100%;max-width:360px}
.power-label{font-size:12px;color:#64748b;display:flex;justify-content:space-between;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--grana)}

.shoot-btn{margin-top:4px;padding:14px 34px;border:none;border-radius:999px;cursor:pointer;
  font-size:16px;font-weight:900;color:#fff;
  background:linear-gradient(135deg,var(--grana),var(--blau));
  box-shadow:0 10px 24px rgba(165,0,68,0.35);transition:transform .2s,opacity .2s}
.shoot-btn:hover{transform:translateY(-2px)}
.shoot-btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

.hint{margin-top:12px;font-size:13px;color:#64748b}
footer{margin-top:26px;font-size:13px;color:#64748b}
.vb{color:var(--grana);font-weight:700}
</style>
</head>
<body>

<div class="topbar"><a href="index.html">← 홈으로</a></div>

<div class="wrap">
  <h1>⚽ 페널티킥</h1>
  <p class="sub">PENALTY SHOOTOUT · 5 KICKS</p>

  <div class="scorebar">
    <div class="chip"><div class="l">GOALS</div><div class="v" id="goals">0</div></div>
    <div class="chip"><div class="l">KICKS</div><div class="v" id="kicks">0 / 5</div></div>
    <div class="chip"><div class="l">BEST</div><div class="v" id="best">0</div></div>
  </div>

  <div class="board-shell">
    <canvas id="game" width="440" height="300"></canvas>
  </div>

  <div class="msg" id="msg">방향과 힘을 정하고 슛을 차세요!</div>

  <div class="controls">
    <div class="aim-row">
      <button class="aim-btn" data-aim="left">◀ 왼쪽</button>
      <button class="aim-btn active" data-aim="center">가운데</button>
      <button class="aim-btn" data-aim="right">오른쪽 ▶</button>
    </div>

    <div class="power-wrap">
      <div class="power-label"><span>약하게</span><span>세게</span></div>
      <input type="range" id="power" min="30" max="100" value="65">
    </div>

    <button class="shoot-btn" id="shoot">🥅 슛!</button>
  </div>

  <p class="hint">너무 세게 차면 골대를 넘기고, 골키퍼가 방향을 읽으면 막혀요. 구석을 노려보세요!</p>

  <footer>© 2026 FC Barcelona Fan Website · <span class="vb">Visca el Barça! 🔵🔴</span></footer>
</div>

<script>
(function(){
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const goalsEl = document.getElementById('goals');
  const kicksEl = document.getElementById('kicks');
  const bestEl = document.getElementById('best');
  const msgEl = document.getElementById('msg');
  const shootBtn = document.getElementById('shoot');
  const powerEl = document.getElementById('power');

  let aim = 'center';
  let goals = 0, kicks = 0, animating = false, gameOver = false;
  let best = parseInt(localStorage.getItem('penalty_best') || '0', 10);
  bestEl.textContent = best;

  // 골대 영역
  const goal = { x: W*0.18, y: 40, w: W*0.64, h: 92 };
  // 3개 목표 지점(왼/중/우)의 x 비율
  const targets = { left: goal.x + goal.w*0.18, center: goal.x + goal.w*0.5, right: goal.x + goal.w*0.82 };

  // 공/골키퍼 상태
  let ball = { x: W/2, y: H-40, r: 11 };
  let keeper = { x: W/2, y: goal.y + goal.h - 20, w: 46, h: 40, dive: 0 }; // dive: -1 left, 0 center, 1 right

  function setAim(a){
    aim = a;
    document.querySelectorAll('.aim-btn').forEach(b=>{
      b.classList.toggle('active', b.dataset.aim === a);
    });
  }
  document.querySelectorAll('.aim-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ if(!animating && !gameOver) setAim(b.dataset.aim); });
  });

  function draw(ballPos, keeperDX, result){
    // 잔디
    ctx.fillStyle = '#15803d';
    ctx.fillRect(0,0,W,H);
    // 잔디 줄무늬
    ctx.fillStyle = 'rgba(255,255,255,0.04)';
    for(let i=0;i<W;i+=40){ ctx.fillRect(i,0,20,H); }

    // 페널티 박스 라인
    ctx.strokeStyle = 'rgba(255,255,255,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(W*0.1, goal.y+goal.h, W*0.8, H-(goal.y+goal.h)-6);
    // 페널티 스팟
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.beginPath(); ctx.arc(W/2, H-40, 2.5, 0, Math.PI*2); ctx.fill();

    // 골대
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 5;
    ctx.strokeRect(goal.x, goal.y, goal.w, goal.h);
    // 그물
    ctx.strokeStyle = 'rgba(255,255,255,0.35)';
    ctx.lineWidth = 1;
    for(let gx=goal.x; gx<=goal.x+goal.w; gx+=14){ ctx.beginPath(); ctx.moveTo(gx,goal.y); ctx.lineTo(gx,goal.y+goal.h); ctx.stroke(); }
    for(let gy=goal.y; gy<=goal.y+goal.h; gy+=14){ ctx.beginPath(); ctx.moveTo(goal.x,gy); ctx.lineTo(goal.x+goal.w,gy); ctx.stroke(); }

    // 골키퍼
    const kx = keeper.x + keeperDX;
    ctx.fillStyle = '#edbb00';
    ctx.fillRect(kx - keeper.w/2, keeper.y - keeper.h, keeper.w, keeper.h);
    ctx.fillStyle = '#004d98';
    ctx.fillRect(kx - keeper.w/2, keeper.y - keeper.h, keeper.w, 10); // 상의 띠
    // 장갑(팔)
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(kx - keeper.w/2 - 6, keeper.y - keeper.h + 6, 8, 8);
    ctx.fillRect(kx + keeper.w/2 - 2, keeper.y - keeper.h + 6, 8, 8);

    // 공
    ctx.beginPath();
    ctx.arc(ballPos.x, ballPos.y, ball.r, 0, Math.PI*2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.lineWidth = 1.5; ctx.strokeStyle = '#111'; ctx.stroke();
    // 공 무늬(오각형 느낌 점 3개)
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(ballPos.x, ballPos.y-2, 2.4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ballPos.x-4, ballPos.y+3, 2, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(ballPos.x+4, ballPos.y+3, 2, 0, Math.PI*2); ctx.fill();

    // 결과 텍스트
    if(result){
      ctx.font = '900 34px "Apple SD Gothic Neo", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillStyle = result === 'GOAL' ? '#ffffff' : '#ffd1dc';
      ctx.strokeStyle = 'rgba(0,0,0,0.5)'; ctx.lineWidth = 4;
      ctx.strokeText(result, W/2, H/2);
      ctx.fillText(result, W/2, H/2);
    }
  }

  function shoot(){
    if(animating || gameOver) return;
    animating = true;
    shootBtn.disabled = true;

    const power = parseInt(powerEl.value, 10); // 30~100
    const targetX = targets[aim];
    // 공이 날아갈 목표 y: 파워가 클수록 위로(골대 윗부분/넘어감)
    // 파워 90 이상이면 넘길 확률
    const overshoot = power > 90 && Math.random() < 0.55;
    const targetY = overshoot ? goal.y - 24 : (goal.y + goal.h*0.45);

    // 골키퍼 판단: aim 방향을 확률적으로 읽음
    const dirVal = aim === 'left' ? -1 : (aim === 'right' ? 1 : 0);
    let guess;
    const r = Math.random();
    if(r < 0.45){ guess = dirVal; }                 // 45% 정확히 읽음
    else if(r < 0.7){ guess = [-1,0,1][Math.floor(Math.random()*3)]; } // 랜덤
    else { guess = -dirVal || [-1,1][Math.floor(Math.random()*2)]; }   // 반대로

    keeper.dive = guess;
    const keeperTargetDX = guess * (goal.w*0.30);

    const start = { x: ball.x, y: ball.y };
    let t = 0;
    const duration = Math.max(28, 70 - power*0.35); // 세게 찰수록 빠름

    function frame(){
      t++;
      const p = Math.min(1, t/duration);
      const ease = 1 - Math.pow(1-p, 2);
      const bx = start.x + (targetX - start.x)*ease;
      const by = start.y + (targetY - start.y)*ease;
      const kdx = keeperTargetDX * ease;
      draw({x:bx,y:by}, kdx);

      if(p < 1){ requestAnimationFrame(frame); }
      else { resolve(targetX, targetY, keeperTargetDX, overshoot); }
    }
    frame();
  }

  function resolve(targetX, targetY, keeperDX, overshoot){
    kicks++;
    let result, scored = false;

    const keeperCenterX = keeper.x + keeperDX;
    const savedByKeeper = Math.abs(targetX - keeperCenterX) < (keeper.w/2 + ball.r);

    if(overshoot){
      result = 'OVER!'; // 골대 넘김
      msgEl.textContent = '아깝다! 골대를 넘겼어요 😵';
    } else if(savedByKeeper){
      result = 'SAVED'; // 골키퍼 선방
      msgEl.textContent = '골키퍼 선방! 막혔어요 🧤';
    } else {
      result = 'GOAL'; scored = true; goals++;
      msgEl.textContent = '⚽ 골인! 멋진 슛이에요!';
    }

    goalsEl.textContent = goals;
    kicksEl.textContent = kicks + ' / 5';

    // 결과 화면 잠깐 표시
    const ballFinal = { x: targetX, y: overshoot ? goal.y - 24 : targetY };
    draw(ballFinal, keeperDX, result);

    setTimeout(()=>{
      if(kicks >= 5){
        endGame();
      } else {
        // 다음 킥 준비
        animating = false;
        shootBtn.disabled = false;
        keeper.dive = 0;
        draw({x:W/2, y:H-40}, 0);
        msgEl.textContent = '다음 킥! 방향과 힘을 정하세요.';
        msgEl.style.color = 'var(--grana)';
      }
    }, 1100);
  }

  function endGame(){
    gameOver = true;
    animating = false;
    shootBtn.disabled = false;
    shootBtn.textContent = '↻ 다시 하기';
    if(goals > best){ best = goals; localStorage.setItem('penalty_best', String(best)); bestEl.textContent = best; }
    let grade = goals === 5 ? '퍼펙트! 🏆' : goals >= 3 ? '훌륭해요! 👏' : goals >= 1 ? '좋아요!' : '다음엔 더 잘할 거예요!';
    msgEl.textContent = `끝! ${goals}/5 골 · ${grade}`;
    msgEl.style.color = 'var(--blau)';
  }

  function resetGame(){
    goals = 0; kicks = 0; gameOver = false; animating = false;
    keeper.dive = 0;
    goalsEl.textContent = '0';
    kicksEl.textContent = '0 / 5';
    shootBtn.textContent = '🥅 슛!';
    shootBtn.disabled = false;
    msgEl.textContent = '방향과 힘을 정하고 슛을 차세요!';
    msgEl.style.color = 'var(--grana)';
    draw({x:W/2, y:H-40}, 0);
  }

  shootBtn.addEventListener('click', ()=>{
    if(gameOver){ resetGame(); return; }
    shoot();
  });

  // 키보드: 방향키 + 스페이스
  window.addEventListener('keydown', e=>{
    if(animating) return;
    if(e.key === 'ArrowLeft'){ setAim('left'); }
    else if(e.key === 'ArrowRight'){ setAim('right'); }
    else if(e.key === 'ArrowUp' || e.key === 'ArrowDown'){ setAim('center'); }
    else if(e.key === ' '){ e.preventDefault(); if(gameOver) resetGame(); else shoot(); }
  });

  // 최초 렌더
  resetGame();
})();
</script>

</body>
</html>
