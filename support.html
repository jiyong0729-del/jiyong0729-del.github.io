<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>선수 응원하기 · FC Barcelona</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--blau:#004d98;--grana:#a50044;--gold:#d69e00;--ink:#ffffff}
html{scroll-behavior:smooth}
body{min-height:100vh;background:var(--ink);color:#1a2235;font-family:'Apple SD Gothic Neo','Noto Sans KR',sans-serif;line-height:1.6}

.topbar{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:10px;padding:14px 20px;background:rgba(255,255,255,0.85);backdrop-filter:blur(8px);border-bottom:1px solid #e2e8f0}
.topbar a{color:var(--grana);text-decoration:none;font-size:14px;font-weight:700}
.topbar a:hover{text-decoration:underline}

.hero{position:relative;padding:48px 24px 36px;text-align:center;overflow:hidden;
  background:radial-gradient(800px 400px at 30% 10%, rgba(165,0,68,0.5), transparent 60%),
    radial-gradient(800px 400px at 80% 90%, rgba(0,77,152,0.6), transparent 55%),
    linear-gradient(135deg,#001a33,#0a0f1e 55%,#2a0012)}
.hero h1{font-size:clamp(28px,7vw,44px);font-weight:900;letter-spacing:-1px;
  background:linear-gradient(90deg,#4aa3ff,#fff 45%,var(--gold));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px}
.hero p{font-size:14px;color:#cbd5e1}

#wrap{max-width:860px;margin:0 auto;padding:30px 20px 50px}

.pos-section{margin-bottom:34px}
.pos-title{font-size:20px;font-weight:800;color:#0f172a;margin-bottom:16px;display:flex;align-items:center;gap:10px;position:relative;padding-left:14px}
.pos-title::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:5px;border-radius:4px;background:linear-gradient(var(--blau),var(--grana))}
.pos-badge{font-size:12px;font-weight:800;color:#fff;padding:3px 10px;border-radius:999px;background:linear-gradient(135deg,var(--grana),var(--blau))}

.players{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.p-card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 8px 22px rgba(0,30,80,0.06);display:flex;flex-direction:column;gap:10px}
.p-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.p-name{font-size:16px;font-weight:800;color:#0f172a}
.p-meta{font-size:12px;color:#94a3b8}
.cheer-row{display:flex;align-items:center;gap:10px}
.cheer-btn{flex:1;border:none;cursor:pointer;padding:10px;border-radius:10px;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--grana),var(--blau));box-shadow:0 6px 16px rgba(165,0,68,0.25);transition:transform .12s}
.cheer-btn:hover{transform:translateY(-2px)}
.cheer-btn:active{transform:scale(.96)}
.cheer-count{font-size:15px;font-weight:900;color:var(--grana);min-width:64px;text-align:right;white-space:nowrap}
.heart-pop{display:inline-block;animation:pop .4s ease}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.5)}100%{transform:scale(1)}}

/* 응원 댓글 */
.comment-card{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:24px;box-shadow:0 10px 30px rgba(0,30,80,0.08);margin-top:10px}
.comment-card h2{font-size:20px;font-weight:800;color:#0f172a;margin-bottom:16px}
.cform{display:flex;flex-direction:column;gap:12px}
.cform input,.cform textarea{width:100%;padding:12px 14px;border:1px solid #d7deea;border-radius:10px;font-size:14px;font-family:inherit;background:#fbfcfe;color:#1a2235;resize:vertical}
.cform input:focus,.cform textarea:focus{outline:none;border-color:var(--blau);box-shadow:0 0 0 3px rgba(0,77,152,0.12)}
.cform textarea{min-height:76px}
.cform select{padding:12px 14px;border:1px solid #d7deea;border-radius:10px;font-size:14px;background:#fbfcfe;color:#1a2235}
.c-submit{align-self:flex-end;padding:12px 24px;border:none;border-radius:999px;cursor:pointer;font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--grana),var(--blau));box-shadow:0 8px 20px rgba(165,0,68,0.3);transition:transform .2s}
.c-submit:hover{transform:translateY(-2px)}
.c-submit:disabled{opacity:.5;cursor:not-allowed}
.c-status{font-size:13px;min-height:18px;color:#64748b}
.c-status.ok{color:#15803d}.c-status.err{color:var(--grana)}
.c-list{list-style:none;display:flex;flex-direction:column;gap:12px;margin-top:18px}
.c-item{background:#f5f7fb;border:1px solid #e2e8f0;border-left:4px solid var(--grana);border-radius:10px;padding:14px 16px}
.c-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:4px}
.c-name{font-weight:800;color:#0f172a;font-size:15px}
.c-for{font-size:12px;font-weight:700;color:var(--blau)}
.c-date{font-size:12px;color:#94a3b8;white-space:nowrap}
.c-msg{font-size:14px;color:#334155;white-space:pre-wrap;word-break:break-word}
.c-empty{font-size:14px;color:#94a3b8;text-align:center;padding:16px}

footer{text-align:center;padding:30px 0;font-size:13px;color:#64748b}
.vb{color:var(--grana);font-weight:700}
</style>
</head>
<body>

<div class="topbar"><a href="index.html">← 홈으로</a></div>

<section class="hero">
  <h1>💙 선수 응원하기 ❤️</h1>
  <p>포지션별 바르샤 1군 선수들에게 응원을 보내주세요! 응원과 댓글은 Supabase에 저장됩니다.</p>
</section>

<div id="wrap">
  <div id="positions">
    <p class="c-empty">선수 응원 현황을 불러오는 중…</p>
  </div>

  <!-- 응원 댓글 -->
  <div class="comment-card">
    <h2>📣 응원 댓글 남기기</h2>
    <form class="cform" id="cForm">
      <input type="text" id="cName" placeholder="이름 (닉네임)" maxlength="30" required>
      <select id="cFor">
        <option value="">응원할 선수 선택 (선택 안 하면 '전체')</option>
      </select>
      <textarea id="cMsg" placeholder="선수에게 보내는 응원 메시지 ⚽" maxlength="300" required></textarea>
      <button type="submit" class="c-submit" id="cSubmit">📣 응원 보내기</button>
      <p class="c-status" id="cStatus"></p>
    </form>
    <ul class="c-list" id="cList">
      <li class="c-empty">응원 댓글을 불러오는 중…</li>
    </ul>
  </div>

  <footer>© 2026 FC Barcelona Fan Website · <span class="vb">Visca el Barça! 🔵🔴</span></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  "use strict";
  const SUPABASE_URL = "https://kbpwlnxzjtqszxpuyzvr.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImticHdsbnh6anRxc3p4cHV5enZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTM1OTMyMDYsImV4cCI6MjEwOTE2OTIwNn0.YCA3XsBhu0r2RZeWxJVgY_QiW8j3WvkI6hsvSLBuies";
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const POS_LABEL = { GK:'골키퍼', DF:'수비수', MF:'미드필더', FW:'공격수' };
  const POS_ORDER = ['GK','DF','MF','FW'];

  const posWrap = document.getElementById('positions');
  const cForm = document.getElementById('cForm');
  const cName = document.getElementById('cName');
  const cFor = document.getElementById('cFor');
  const cMsg = document.getElementById('cMsg');
  const cSubmit = document.getElementById('cSubmit');
  const cStatus = document.getElementById('cStatus');
  const cList = document.getElementById('cList');

  function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
  function setCStatus(t,type){ cStatus.textContent=t||''; cStatus.className='c-status'+(type?' '+type:''); }
  function fmtDate(iso){ try{ return new Date(iso).toLocaleString('ko-KR',{month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}); }catch(e){ return ''; } }

  // 선수 응원(하트) 로드
  async function loadCheers(){
    const { data, error } = await supabase.from('player_cheers').select('*').order('position',{ascending:true}).order('name',{ascending:true});
    if(error){ posWrap.innerHTML = '<p class="c-empty">불러오기 실패: '+esc(error.message)+'</p>'; return; }
    if(!data || data.length===0){ posWrap.innerHTML = '<p class="c-empty">선수 데이터가 없습니다. (Supabase player_cheers 테이블을 확인하세요)</p>'; return; }

    // 포지션별 그룹화
    const groups = {};
    data.forEach(p => { (groups[p.position] = groups[p.position] || []).push(p); });

    let html = '';
    POS_ORDER.forEach(pos => {
      if(!groups[pos]) return;
      html += '<div class="pos-section"><div class="pos-title"><span class="pos-badge">'+pos+'</span> '+(POS_LABEL[pos]||pos)+'</div><div class="players">';
      groups[pos].forEach(p => {
        html += '<div class="p-card"><div class="p-top"><span class="p-name">'+esc(p.name)+'</span><span class="p-meta">'+(p.number!=null?('#'+p.number):'')+'</span></div>'+
          '<div class="cheer-row"><button class="cheer-btn" data-id="'+p.id+'">👏 응원</button>'+
          '<span class="cheer-count" id="cc-'+p.id+'">❤️ '+(p.cheers||0)+'</span></div></div>';
      });
      html += '</div></div>';
    });
    posWrap.innerHTML = html;

    posWrap.querySelectorAll('.cheer-btn').forEach(btn => {
      btn.addEventListener('click', () => cheer(parseInt(btn.dataset.id,10)));
    });

    // 댓글 대상 선택 옵션 채우기
    if(cFor.options.length <= 1){
      data.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p.name; opt.textContent = '['+p.position+'] '+p.name;
        cFor.appendChild(opt);
      });
    }
  }

  // 응원 하트 +1 (여러 번 가능)
  async function cheer(id){
    const { data: cur, error: e1 } = await supabase.from('player_cheers').select('cheers').eq('id',id).single();
    if(e1){ return; }
    const next = (cur.cheers||0)+1;
    const { error: e2 } = await supabase.from('player_cheers').update({ cheers: next }).eq('id',id);
    if(e2){ return; }
    const el = document.getElementById('cc-'+id);
    if(el){ el.innerHTML = '<span class="heart-pop">❤️ '+next+'</span>'; }
  }

  // 응원 댓글 로드
  async function loadComments(){
    const { data, error } = await supabase.from('player_comments').select('*').order('created_at',{ascending:false}).limit(50);
    if(error){ cList.innerHTML = '<li class="c-empty">불러오기 실패: '+esc(error.message)+'</li>'; return; }
    if(!data || data.length===0){ cList.innerHTML = '<li class="c-empty">아직 응원 댓글이 없어요. 첫 응원을 남겨보세요!</li>'; return; }
    cList.innerHTML = data.map(r =>
      '<li class="c-item"><div class="c-head"><span class="c-name">'+esc(r.name)+'</span>'+
      (r.target ? '<span class="c-for">→ '+esc(r.target)+'</span>' : '')+
      '<span class="c-date">'+fmtDate(r.created_at)+'</span></div>'+
      '<div class="c-msg">'+esc(r.message)+'</div></li>'
    ).join('');
  }

  // 응원 댓글 저장
  cForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = cName.value.trim(), message = cMsg.value.trim(), target = cFor.value || null;
    if(!name || !message){ setCStatus('이름과 메시지를 입력해주세요.','err'); return; }
    cSubmit.disabled = true; setCStatus('응원 보내는 중…');
    const { error } = await supabase.from('player_comments').insert([{ name, message, target }]);
    if(error){ setCStatus('실패: '+error.message,'err'); cSubmit.disabled=false; return; }
    setCStatus('응원이 등록됐어요! 고마워요 🔵🔴','ok');
    cMsg.value=''; cSubmit.disabled=false;
    loadComments();
  });

  loadCheers();
  loadComments();
})();
</script>

</body>
</html>
